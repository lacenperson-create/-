<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lumina Studio</title>
<meta name="theme-color" content="#0F0F12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lumina">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap">
<style>
:root{--bg:#0F0F12;--surface:#1A1A20;--surface2:#141418;--line:#2A2A33;--text:#F2F0EA;--muted:#8A8A96;--accent:#E8B04B;--ink:#0F0F12}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:Cairo,sans-serif;color:var(--text);background:#050506;display:flex;align-items:center;justify-content:center}
button{font-family:inherit;color:inherit;cursor:pointer}
.app{position:relative;width:100%;max-width:390px;height:100vh;background:var(--bg);overflow:hidden;display:flex;flex-direction:column}
@media (min-width:500px){.app{height:844px;max-height:844px;border-radius:36px;border:1px solid var(--line)}}
.screen{display:none;flex:1;flex-direction:column;min-height:0}
.screen.active{display:flex}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:44px 20px 12px}
.topbar .title{font-weight:600;font-size:16px}
.btn{height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:14px}
.btn.primary{background:var(--accent);color:var(--ink);border:none;font-weight:700}
.icon{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center}
.scroll{flex:1;overflow-y:auto;padding:0 20px 120px}
h1{margin:8px 20px 0;font-size:26px;font-weight:700}
.search{display:block;margin:16px 20px 0}
.search input{width:100%;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--text);padding:0 16px;font-family:inherit;font-size:15px}
.section-label{font-size:13px;color:var(--muted);margin:24px 0 12px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.chip{height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px}
.chip.on{border-color:var(--accent);color:var(--accent)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{border-radius:16px;background:var(--surface);border:1px solid var(--line);overflow:hidden;text-align:start;padding:0}
.card:focus-visible,.chip:focus-visible,.btn:focus-visible,.nav button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card .thumb{height:110px}
.card .meta{padding:12px}
.card .meta small{display:block;color:var(--muted);font-size:12px;margin-top:4px}
.nav{position:absolute;inset-inline:0;bottom:0;height:84px;padding:12px 16px 24px;background:var(--surface2);border-top:1px solid var(--line);display:flex;justify-content:space-around}
.nav button{background:none;border:none;color:var(--muted);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:56px;min-height:44px}
.nav button.on{color:var(--accent)}
.fab{position:absolute;inset-inline-end:20px;bottom:104px;width:58px;height:58px;border-radius:50%;border:none;background:var(--accent);color:var(--ink);font-size:30px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.preview{margin:8px 20px 0;height:330px;border-radius:18px;background:#08080A;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.photo{width:72%;height:78%;border-radius:12px;background:linear-gradient(160deg,#3A3530,#1B1A1E);transition:filter .15s}
.photo.fx-blur{filter:blur(3px)}
.photo.fx-vignette{box-shadow:inset 0 0 60px #000}
.photo.fx-grain{background-image:radial-gradient(rgba(255,255,255,.08) 1px,transparent 1px);background-size:4px 4px}
.tag{position:absolute;bottom:12px;inset-inline-start:14px;font-size:12px;color:var(--muted);background:#0F0F12cc;padding:4px 8px;border-radius:8px}
.tabs{display:flex;margin:20px 20px 0;border-bottom:1px solid var(--line)}
.tabs button{flex:1;height:44px;border:none;background:none;color:var(--muted);font-size:14px;border-bottom:2px solid transparent}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.panel{padding:20px;display:flex;flex-direction:column;gap:18px}
.slider-head{display:flex;justify-content:space-between;font-size:14px;margin-bottom:8px}
.slider-head span:last-child{color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--accent)}
.tools{margin-top:auto;padding:16px 20px 36px;border-top:1px solid var(--line);background:var(--surface2);display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tools button{height:64px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:13px}
.tools button.on{border-color:var(--accent);color:var(--accent)}
.timecode{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.vid{margin:8px 20px 0;height:200px;border-radius:16px;background:#08080A;border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.vid .frame{width:64%;height:72%;border-radius:10px;background:linear-gradient(160deg,#2B3036,#16181B)}
.transport{display:flex;align-items:center;justify-content:space-between;padding:14px 28px 0}
.transport .ctrls{display:flex;align-items:center;gap:18px}
.round{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:16px}
.round.play{width:52px;height:52px;border:none;background:var(--accent);color:var(--ink);font-size:18px}
.tl{position:relative;margin-top:16px;flex:1;border-top:1px solid var(--line);overflow:hidden;padding-bottom:8px}
.ruler{display:flex;height:28px;margin-inline-start:84px;font-size:10px;color:var(--muted);align-items:flex-end;padding-bottom:4px}
.ruler span{width:50px}
.lane{display:flex;align-items:center;height:56px;gap:8px;padding:6px 0}
.lane .lbl{width:76px;font-size:12px;color:var(--muted);padding-inline-start:16px;box-sizing:border-box}
.lane .track{display:flex;gap:4px;flex:1;height:44px;padding-inline-end:12px}
.clip{height:44px;border-radius:8px;background:#2B3036;border:1px solid transparent;color:var(--text);font-size:12px}
.clip.sel{border-color:var(--accent)}
.clip.music{flex:1;background:#1F2A24;border-color:#2F4236;margin-inline-end:12px}
.clip.text{background:var(--accent);color:var(--ink);font-weight:700;width:120px}
.playhead{position:absolute;top:28px;bottom:0;width:2px;background:var(--accent);left:calc(84px + (100% - 96px) * var(--p,0));pointer-events:none}
.vtools{padding:14px 20px 34px;border-top:1px solid var(--line);background:var(--surface2);display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.vtools button{height:60px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:13px}
.toast{position:absolute;bottom:120px;left:50%;transform:translateX(-50%);background:var(--accent);color:var(--ink);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;z-index:10}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="app" id="app">

  <!-- ACCUEIL -->
  <section class="screen active" id="home" aria-label="الرئيسية">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:10px">
        <div style="width:36px;height:36px;border-radius:10px;background:var(--accent);color:var(--ink);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px">L</div>
        <span style="font-weight:700;font-size:18px">Lumina Studio</span>
      </div>
      <button class="icon" aria-label="الإشعارات" data-toast="لا توجد إشعارات جديدة">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>
      </button>
    </div>
    <h1>ماذا نصنع اليوم؟</h1>
    <label class="search"><input type="search" placeholder="ابحث عن أداة أو مشروع" id="q"></label>
    <div class="scroll">
      <div class="section-label">أدوات سريعة</div>
      <div class="row">
        <button class="chip on" data-toast="تحسين الصورة بالذكاء الاصطناعي">تحسين بالذكاء الاصطناعي</button>
        <button class="chip" data-toast="إزالة الخلفية">إزالة الخلفية</button>
        <button class="chip" data-toast="القص الذكي">قص ذكي</button>
      </div>
      <div class="section-label">مشاريعي الأخيرة</div>
      <div class="cards">
        <button class="card" data-open="video"><div class="thumb" style="background:#2B3036"></div><div class="meta">ريلز الصيف<small>فيديو · 00:45</small></div></button>
        <button class="card" data-open="photo"><div class="thumb" style="background:#33302A"></div><div class="meta">بورتريه مدينة<small>صورة · 4K</small></div></button>
        <button class="card" data-open="video"><div class="thumb" style="background:#252A2E"></div><div class="meta">فيديو السفر<small>فيديو · 02:10</small></div></button>
        <button class="card" data-open="photo"><div class="thumb" style="background:#2E2530"></div><div class="meta">تعرض مزدوج<small>صورة · مسودة</small></div></button>
      </div>
    </div>
    <button class="fab" aria-label="مشروع جديد" data-open="photo">+</button>
    <nav class="nav">
      <button class="on" data-tab="home"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg>الرئيسية</button>
      <button data-toast="قسم المشاريع قريباً">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg>المشاريع</button>
      <button data-toast="AI Studio قريباً">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 3l2 5 5 2-5 2-2 5-2-5-5-2 5-2z"/></svg>AI Studio</button>
      <button data-toast="الحساب قريباً">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>حسابي</button>
    </nav>
  </section>

  <!-- MEDIA PHOTO -->
  <section class="screen" id="photo" aria-label="محرر الصور">
    <div class="topbar">
      <button class="btn" data-go="home">رجوع</button>
      <span class="title">تحرير الصورة</span>
      <button class="btn primary" data-toast="تم التصدير بنجاح">تصدير</button>
    </div>
    <div class="preview">
      <div class="photo" id="photoEl"></div>
      <span class="tag">قبل / بعد</span>
    </div>
    <div class="tabs" role="tablist">
      <button class="on" data-ptab="adj" role="tab">ضبط</button>
      <button data-ptab="color" role="tab">ألوان</button>
      <button data-ptab="fx" role="tab">تأثيرات</button>
      <button data-ptab="ai" role="tab">AI</button>
    </div>
    <div class="scroll" style="padding-bottom:20px">
      <div class="panel" id="p-adj">
        <div><div class="slider-head"><span>السطوع</span><span id="v-b">62</span></div><input type="range" min="0" max="100" value="62" id="b" aria-label="السطوع"></div>
        <div><div class="slider-head"><span>التباين</span><span id="v-c">40</span></div><input type="range" min="0" max="100" value="40" id="c" aria-label="التباين"></div>
        <div><div class="slider-head"><span>التشبع</span><span id="v-s">75</span></div><input type="range" min="0" max="100" value="75" id="s" aria-label="التشبع"></div>
      </div>
      <div class="panel" id="p-color" hidden>
        <div class="section-label" style="margin:0">فلاتر جاهزة</div>
        <div class="row">
          <button class="chip" data-preset="warm">دافئ</button>
          <button class="chip" data-preset="cool">بارد</button>
          <button class="chip" data-preset="bw">أبيض وأسود</button>
          <button class="chip" data-preset="cine">سينمائي</button>
        </div>
      </div>
      <div class="panel" id="p-fx" hidden>
        <div class="section-label" style="margin:0">تأثيرات</div>
        <div class="row">
          <button class="chip" data-fx="blur">ضبابية</button>
          <button class="chip" data-fx="grain">حبيبات</button>
          <button class="chip" data-fx="vignette">تظليل الحواف</button>
        </div>
      </div>
      <div class="panel" id="p-ai" hidden>
        <div class="section-label" style="margin:0">أدوات الذكاء الاصطناعي</div>
        <div class="row">
          <button class="chip" id="aiEnh">تحسين تلقائي</button>
          <button class="chip" data-toast="تمت إزالة الضوضاء">إزالة الضوضاء</button>
        </div>
      </div>
    </div>
    <div class="tools">
      <button data-toast="تم عزل الخلفية">عزل الخلفية</button>
      <button data-toast="اضغط على الصورة لإزالة عنصر">ممحاة سحرية</button>
      <button id="aiEnh2">تحسين AI</button>
    </div>
  </section>

  <!-- MEDIA VIDEO -->
  <section class="screen" id="video" aria-label="محرر الفيديو">
    <div class="topbar">
      <button class="btn" data-go="home">رجوع</button>
      <span class="title">ريلز الصيف</span>
      <button class="btn primary" data-toast="تم التصدير بنجاح">تصدير</button>
    </div>
    <div class="vid"><div class="frame"></div></div>
    <div class="transport">
      <span class="timecode" id="tc">00:12 / 00:45</span>
      <div class="ctrls">
        <button class="round" aria-label="السابق" id="back">‹</button>
        <button class="round play" aria-label="تشغيل" id="play">▶</button>
        <button class="round" aria-label="التالي" id="fwd">›</button>
      </div>
      <span class="timecode">9:16</span>
    </div>
    <div class="tl" id="tl">
      <div class="ruler"><span>0:00</span><span>0:05</span><span>0:10</span><span>0:15</span><span>0:20</span></div>
      <div class="lane"><div class="lbl">فيديو</div><div class="track">
        <button class="clip sel" style="width:110px">لقطة 1</button>
        <button class="clip" style="width:150px">لقطة 2</button>
        <button class="clip" style="width:70px">لقطة 3</button>
      </div></div>
      <div class="lane"><div class="lbl">موسيقى</div><div class="track"><button class="clip music">موسيقى الخلفية</button></div></div>
      <div class="lane"><div class="lbl">نص</div><div class="track"><button class="clip text" data-toast="تمت الترجمة التلقائية">ترجمة تلقائية</button></div></div>
      <div class="playhead" id="ph"></div>
    </div>
    <div class="vtools">
      <button data-toast="تم القص عند المؤشر">قص</button>
      <button data-toast="اختر انتقالاً">انتقال</button>
      <button data-toast="أضف نصاً جديداً">نص</button>
      <button data-toast="تم تثبيت الفيديو">تثبيت AI</button>
    </div>
  </section>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<script>
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];

// Navigation
function show(id){
  $$('.screen').forEach(s => s.classList.toggle('active', s.id === id));
}
$$('[data-go]').forEach(b => b.onclick = () => show(b.dataset.go));
$$('[data-open]').forEach(b => b.onclick = () => show(b.dataset.open));
$$('.nav button[data-tab]').forEach(b => b.onclick = () => show('home'));

// Toast
let tt;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 1800);
}
$$('[data-toast]').forEach(b => b.addEventListener('click', () => toast(b.dataset.toast)));

// Tabs in photo editor
$$('[data-ptab]').forEach(b => b.onclick = () => {
  $$('[data-ptab]').forEach(x => { x.classList.toggle('on', x === b); x.setAttribute('aria-selected', x === b); });
  ['adj','color','fx','ai'].forEach(k => $('#p-' + k).hidden = (k !== b.dataset.ptab));
});

// Photo adjustments
const photo = $('#photoEl');
const sliders = {b:[62,'b'], c:[40,'c'], s:[75,'s']};
function applyFilters(){
  const b = +$('#b').value, c = +$('#c').value, s = +$('#s').value;
  $('#v-b').textContent = b; $('#v-c').textContent = c; $('#v-s').textContent = s;
  photo.style.filter = `brightness(${0.5 + b/100}) contrast(${0.5 + c/100}) saturate(${0.5 + s/100})`;
}
['b','c','s'].forEach(id => $('#' + id).addEventListener('input', applyFilters));
function setVals(b,c,s){ $('#b').value=b; $('#c').value=c; $('#s').value=s; applyFilters(); }
applyFilters();

const presets = {
  warm: [70,45,95], cool: [55,50,60], bw: [60,60,0], cine: [45,70,50]
};
const presetNames = {warm:'دافئ',cool:'بارد',bw:'أبيض وأسود',cine:'سينمائي'};
$$('[data-preset]').forEach(b => b.onclick = () => {
  const p = presets[b.dataset.preset];
  setVals(...p);
  $$('[data-preset]').forEach(x => x.classList.toggle('on', x === b));
  toast('تم تطبيق فلتر ' + presetNames[b.dataset.preset]);
});

// Effects
$$('[data-fx]').forEach(b => b.onclick = () => {
  const cls = 'fx-' + b.dataset.fx;
  const on = !b.classList.contains('on');
  b.classList.toggle('on', on);
  photo.classList[on ? 'add' : 'remove'](cls);
  toast(on ? 'تم تفعيل التأثير' : 'تم إلغاء التأثير');
});

// AI enhance
function enhance(){
  toast('جارٍ التحسين بالذكاء الاصطناعي…');
  setTimeout(() => { setVals(68,55,80); toast('تم تحسين الصورة'); }, 900);
}
$('#aiEnh').onclick = enhance;
$('#aiEnh2').onclick = enhance;

// Tools row toggles
$$('#photo .tools button:not(#aiEnh2)').forEach(b => b.addEventListener('click', () => {
  b.classList.toggle('on');
}));

// Video playback
const DURATION = 45;
let t = 12, playing = false, timer = null;
const fmt = s => `${String(Math.floor(s/60)).padStart(2,'0')}:${String(Math.floor(s%60)).padStart(2,'0')}`;
function render(){
  $('#tc').textContent = `${fmt(t)} / ${fmt(DURATION)}`;
  $('#tl').style.setProperty('--p', (t / DURATION).toFixed(4));
}
function stop(){
  playing = false; clearInterval(timer); timer = null;
  $('#play').textContent = '▶'; $('#play').setAttribute('aria-label','تشغيل');
}
$('#play').onclick = () => {
  if (playing) return stop();
  playing = true;
  $('#play').textContent = '❚❚'; $('#play').setAttribute('aria-label','إيقاف');
  timer = setInterval(() => {
    t += 0.1;
    if (t >= DURATION) { t = 0; }
    render();
  }, 100);
};
$('#back').onclick = () => { t = Math.max(0, t - 5); render(); };
$('#fwd').onclick = () => { t = Math.min(DURATION, t + 5); render(); };
$$('#video .clip:not(.music):not(.text)').forEach(c => c.onclick = () => {
  $$('#video .clip').forEach(x => x.classList.remove('sel'));
  c.classList.add('sel');
  toast('تم تحديد ' + c.textContent.trim());
});
render();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
